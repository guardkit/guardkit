  real users table, DB-down degrades honestly to 503 naming the cause. The second
  forge end-to-end run''s demo feature: FEAT-UPT1-class size, one honest step more
  real. Gherkin + assumptions in features/users-count-endpoint/ (all four assumptions
  CONFIRMED by Rich 2026-07-27).'
