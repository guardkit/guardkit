# F4 · gate registry (guardkit qa kind: gate-registry)
# The durable, named gate scripts this repo carries. The live-gate runner
# executes ONLY registered gates. Each script honours the F4 contract: exit 0 =
# pass; a non-zero exit enumerates its failures as a JSON results envelope on
# stdout (assertion id, observed/expected, evidence_ref).
#
# base_url comes from the env-var NAMED here (base_url_env), never a hard-coded
# URL (LPA-02). Default when unset: http://localhost:8901 (the compose front
# door — see docker-compose.yml, app service host port 8901).
#
# The FEATURE-BEHAVIOUR gate TEMPLATE (qa/gates/feature_behaviour_gate.py) is
# intentionally NOT registered here: it is a template S3 copies + fills in
# (endpoint + assertions) and registers as its own entry (e.g. a `stats` gate
# pointing at qa/gates/stats_gate.py with pass-bar-STATS.yaml).
format_version: "1.0"
gates:
  - id: health
    path: qa/gates/health_gate.py
    target:
      base_url_env: API_TEST_BASE_URL
      environment_id: local
    preconditions:
      - suite_vs_ledger
    preflight:
      - tool_imports
      - base_url_reachable
    pass_bar_ref: qa/pass-bar-HEALTH.yaml
    evidence_dir_pattern: qa/gates/evidence/{run_id}
  - id: stats
    path: qa/gates/stats_gate.py
    target:
      base_url_env: API_TEST_BASE_URL
      environment_id: local
    preconditions:
      - suite_vs_ledger
    preflight:
      - tool_imports
      - base_url_reachable
    pass_bar_ref: qa/pass-bar-TASK-STAT-001.yaml
    evidence_dir_pattern: qa/gates/evidence/{run_id}
  - id: version
    path: qa/gates/version_gate.py
    target:
      base_url_env: API_TEST_BASE_URL
      environment_id: local
    preconditions:
      - suite_vs_ledger
    preflight:
      - tool_imports
      - base_url_reachable
    pass_bar_ref: qa/pass-bar-TASK-B70F-001.yaml
    evidence_dir_pattern: qa/gates/evidence/{run_id}
  # DCL spec-track gate (Phase D / D3): the generic dcl_gate.py locates the
  # feature's derived assertion set under qa/dcl/derived/ and delegates to
  # guardkit's assertion_runner (F4 envelope). The gate's assertion SOURCE is the
  # .dcl + its derived set; pass_bar_ref names the SAME feature's pass bar so
  # pre-flight's negative-path readiness check (F1) has a bar to read — this is
  # the stats feature (TASK-STAT-001), the very capability the .dcl promotes.
  - id: dcl-stats
    path: qa/gates/dcl_gate.py
    target:
      base_url_env: API_TEST_BASE_URL
      environment_id: local
    preconditions:
      - suite_vs_ledger
    preflight:
      - tool_imports
      - base_url_reachable
    pass_bar_ref: qa/pass-bar-TASK-STAT-001.yaml
    evidence_dir_pattern: qa/gates/evidence/{run_id}
  # HURL-TWIN PILOT (Rich's Q1/Q3 ruling 2026-08-14, options card 2062dd8):
  # qa/gates/hurl_twin_gate.py runs every Hurl twin under qa/twins/ (each twin
  # = one approved Gherkin scenario, verbatim spec in its header) and adapts
  # the Hurl JSON report into the F4 envelope. Rides this existing seam with
  # ZERO guardkit changes.
  - id: hurl-twins
    path: qa/gates/hurl_twin_gate.py
    target:
      base_url_env: API_TEST_BASE_URL
      environment_id: local
    preflight:
      - tool_imports
      - base_url_reachable
    pass_bar_ref: qa/pass-bar-HURL-TWINS.yaml
    evidence_dir_pattern: qa/gates/evidence/{run_id}
