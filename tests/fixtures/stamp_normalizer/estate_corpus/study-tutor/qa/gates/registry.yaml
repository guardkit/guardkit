# F4 · gate registry (guardkit qa kind: gate-registry) — study-tutor QA surface.
# The durable, named gate scripts this repo carries. The live-gate runner
# executes ONLY registered gates. Each script honours the F4 contract: exit 0 =
# pass; a non-zero exit enumerates its failures as a JSON results envelope on
# stdout (assertion id, observed/expected, evidence_ref).
#
# base_url comes from the env-var NAMED here (base_url_env), never a hard-coded
# URL (LPA-02). Default when unset: http://localhost:8110 (the throwaway local
# serve-http front door — NEVER the live :8100 NAS deployment).
#
# The FEATURE-BEHAVIOUR gate TEMPLATE (qa/gates/feature_behaviour_gate.py) is
# intentionally NOT registered here: it is a template later features COPY + fill
# in (endpoint + assertions) and register as their own entry pointing at their
# own qa/gates/<feature>_gate.py with a pass-bar-<TASK>.yaml.
format_version: "1.0"
gates:
  - id: healthz
    path: qa/gates/healthz_gate.py
    target:
      base_url_env: STUDY_TUTOR_BASE_URL
      environment_id: local
    preconditions:
      - suite_vs_ledger
    preflight:
      - tool_imports
      - base_url_reachable
    pass_bar_ref: qa/pass-bar-HEALTHZ.yaml
    evidence_dir_pattern: qa/gates/evidence/{run_id}
  - id: sessions-readonly
    path: qa/gates/sessions_readonly_gate.py
    target:
      base_url_env: STUDY_TUTOR_BASE_URL
      environment_id: local
    preconditions:
      - suite_vs_ledger
    preflight:
      - tool_imports
      - base_url_reachable
    pass_bar_ref: qa/pass-bar-SESSIONS-READONLY.yaml
    evidence_dir_pattern: qa/gates/evidence/{run_id}
