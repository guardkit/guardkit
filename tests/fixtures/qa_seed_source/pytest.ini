[pytest]
# Fixture-local config: the qa-seed observe_suite subprocess runs pytest with
# cwd=this dir, so this ini is its rootdir config. python_files = check_*.py
# means these tests are collected ONLY here, never by guardkit's own test_*.py
# suite (so the deliberately-red check_red.py cannot turn the parent suite red).
python_files = check_*.py
python_classes = Check*
python_functions = check_*
addopts = -p no:cacheprovider
