# api_test-shaped dcl-binding fixture (D2 golden test).
#
# The J1-J3 facts the DCL cannot carry, plus the two flagged per-field opt-ins
# (J5 format, J6/J9 lifecycle observable) the spike ran on GET /stats. The field
# abbrevs (SVC/REQ/FRA) are the spike's assertion-id labels — a repo/feature
# labelling choice, so they live here in the binding table, not in code.
format_version: "1.0"
capabilities:
  ReportServiceStatistics:
    intents:
      StatisticsQuery: { method: GET, path: /stats }
    success_status: 200
    naming: camel_to_snake
    fields:
      service: { abbrev: SVC }
      requestsServed: { abbrev: REQ }
      firstRequestAt: { abbrev: FRA, format: iso8601_utc, state: Serving }
