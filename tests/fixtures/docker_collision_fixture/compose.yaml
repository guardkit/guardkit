# GuardKit test fixture repository for the repair-7 container-collision
# investigation (design: factory reliability repairs, 12 October 2026).
#
# NOT run by the unit tests, and never against a product. The two-worktree
# reproduction runs it in the sandbox, on one daemon, after the capacity arms
# have closed.
#
# The Compose project name is FIXED on purpose: two builds on one daemon share
# it, which is the shape under investigation. Every resource it creates is
# labelled with the creating build's GUARDKIT_RUN_OWNER (Forge exports it to
# each build), under the same label GuardKit's own fixtures use. Starting it
# without GUARDKIT_RUN_OWNER fails rather than create an unlabelled resource.
#
# Start (as the build's suite would):  docker compose -f compose.yaml up -d
# Tear down, as its own recorded command naming the acting build:
#   ./teardown.sh <receipt.json>
# Analyse: guardkit.orchestrator.container_attribution.attribute_removals.
name: guardkit-collision-fixture

services:
  probe:
    image: busybox:1.36
    command: ["sleep", "600"]
    labels:
      guardkit.fixture.owner: "${GUARDKIT_RUN_OWNER:?GUARDKIT_RUN_OWNER must name the creating build}"

networks:
  default:
    labels:
      guardkit.fixture.owner: "${GUARDKIT_RUN_OWNER:?GUARDKIT_RUN_OWNER must name the creating build}"
