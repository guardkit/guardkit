    last_green: {date: "2026-07-05", sha: 8980af1}
  - id: gate-phase5-delegated
    path: qa/gates/gate_phase5_delegated.py
    target: *lpa_target
    preconditions: [suite_vs_ledger]
    preflight: [login_helper_loads]
