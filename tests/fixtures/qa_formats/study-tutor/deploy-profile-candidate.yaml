# deploy-profile — study-tutor local http front door WITH the candidate-then-
# promote overlay (S2F exemplar, dated addition 2026-07-16). Exercises the
# optional `candidate` section (the execution-surface overlay, forge loader
# c20f28e) on top of the superset-invariant fields (rollback_image_ref +
# live_gate). Conforms to the canonical B10 schema AND the WS2-B8/S2F forge
# loader: the DEPLOY stage stands the build up under a <live>-cand compose
# project on the offset port, gates it, and promotes to the live name only on
# a PASS. keep: false ⇒ tear the candidate down after a successful promote.
format_version: "1.0"
env_id: study-tutor-local-http

hosts:
  - host: localhost
    role: app

compose:
  file: deploy/http/docker-compose.yml

secret_injection:
  - STUDY_TUTOR_PG_DSN
  - STUDY_TUTOR_HTTP_TOKENS

health_checks:
  - cmd: "curl -fsS http://localhost:8100/healthz"
    expected: "ok"

rollback_image_ref: "study-tutor-http:rollback-pre-deploy"

cwd: "."

live_gate:
  driver:
    - python3
    - qa/gates/local_live_gate.py
  gates:
    - healthz
  timeout_seconds: 600
  env:
    STUDY_TUTOR_BASE_URL: "http://localhost:8100"

candidate:
  env:
    CANDIDATE_PORT: "8102"
    STUDY_TUTOR_BASE_URL: "http://localhost:8102"
  keep: false
