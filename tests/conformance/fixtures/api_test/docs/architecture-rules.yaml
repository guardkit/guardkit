# architecture-rules.yaml — api_test
#
# WHAT THIS IS
#   The house rules for how this repository is built, written so a plain program can check
#   them. Each rule quotes one sentence from the architecture record in docs/architecture/
#   — the system overview and the six ADRs Rich read and ruled on 2026-08-30 — and says
#   what a checker looks for in the code.
#
# WHO READS IT
#   The architecture conformance checker: a small Python program that reads this file,
#   parses the code in src/, and reports what it sees. It reports facts only — the file and
#   line, the rule, and the rule's own sentence. It scores nothing, says neither pass nor
#   fail, and today it changes nothing and blocks nothing.
#
# THE ONE PROMISE THIS FILE MAKES
#   Every rule quotes the sentence in the record it comes from, word for word, and names
#   the document and section it came from. A rule with no source sentence is not a rule and
#   does not belong here. Nothing here is derived from the code — rules derived from code
#   would simply describe the code's violations as the rules.
#
# WHAT REPLACED WHAT
#   This replaces the four-rule draft written on 2026-08-22 (commit 8e32872), which was
#   derived from .claude/CLAUDE.md and marked UNRULED because nobody had agreed to it. The
#   record in docs/architecture/ has since been written and ruled, so the rules now come
#   from the ruled record instead of from prose nobody signed. Where that draft's reasoning
#   still holds it is carried forward below, including its list of rules deliberately left
#   out and why. Its rule names are kept under "previously_known_as" so the 2026-08-22
#   conformance design still reads straight.
#
# WHAT IS DELIBERATELY NOT HERE
#   Rules today's code cannot pass, with one deliberate exception (below). A rulebook the
#   code cannot pass is noise from day one. Where the record allows something without
#   requiring it, there is no rule. Sentences in the record that today's code does not
#   satisfy are recorded as notes on the nearest rule, and rules considered and rejected are
#   listed at the bottom, so nothing is quietly dropped.
#
# THE ONE DELIBERATE EXCEPTION
#   src/search/router.py runs its database queries inside the web route handler instead of
#   through a data-access file, and imports another feature's model to do it. That is one
#   violation with two symptoms, written by the factory on 2026-08-16 and merged. It is left
#   in place on purpose as the checker's acceptance test: if the checker does not find it,
#   the checker does not work. Both affected rules carry an "expected_current_finding" block
#   naming the exact lines. It gets fixed as the checker's first real output.

format_version: "1.0"
repo: api_test
source_record: docs/architecture/
record_ruled_by: rich
record_ruled_on: "2026-08-30"
rules_derived_on: "2026-08-30"
replaces: "commit 8e32872, the 2026-08-22 draft derived from .claude/CLAUDE.md"
checker_style: deterministic   # Python's standard-library ast module and file layout only.
                               # No model call, no regex over source code, no network.

# How the checker reads this repository's shape.
layout:
  source_root: src
  # A feature module is any direct child directory of src/ that git tracks and that is not
  # listed as infrastructure. This is a definition, not a list, so a feature added tomorrow
  # is covered without editing this file. Today that means: health, search, stats, time,
  # uptime, users, version, whoami.
  #
  # "that git tracks" is doing real work here. Any machine that has run the tests has an
  # untracked src/__pycache__/ sitting on disk. It is gitignored, it holds no router.py, and
  # a checker that read the directory listing instead of the tracked files would call it a
  # ninth feature and report a false violation of R-ADR001-3 on every developer's machine.
  # So: walk the tracked files. A checker that walks the disk instead must skip the
  # directories named below.
  infrastructure_modules: [src/core, src/db]
  never_a_feature_module: ["__pycache__", "any directory whose name starts with a dot"]
  # main.py wires every feature's router into the app. Importing every feature is its job,
  # so the import-boundary rule cannot apply to it.
  composition_root: [src/main.py]
  # Named in the record as the sanctioned exception to the no-global-schemas rule.
  shared_base_schema_file: src/schemas.py

rules:

  - id: R-OV-1
    previously_known_as: queries-live-in-crud
    rule: Database queries live in the feature's crud.py, not in its router.py.
    source_document: docs/architecture/00-system-overview.md
    source_section: Architectural Layers
    source_sentence: "**CRUD Layer (`crud.py`)**: Implements database operations (Create, Read, Update, Delete) using the repository pattern."
    also_from:
      source_sentence: "**API Layer (`router.py`)**: Defines HTTP endpoints, handles request/response routing, and manages dependency injection at the route level."
      why: the router's stated job is routing and injection, which is the other half of why a query does not belong there
    checked_by: >-
      Parse every file under src/ with Python's ast module. Report a finding for each
      database query statement that sits inside a function body in a file whose name is not
      crud.py, anchored at the line where the query is built. Because this reads the syntax
      tree and not the raw text, code quoted inside a docstring is invisible to it —
      src/db/dependencies.py:29 has "await db.execute(select(User))" inside the get_db
      docstring and must stay silent. If the checker ever reports that line it is reading
      text rather than code, and every number it has produced is suspect.
    signals:
      kind: call-site-home-file
      home_file: crud.py
      scope: all          # every .py file under src/, infrastructure included, so that the
                          # docstring at src/db/dependencies.py:29 stays inside the
                          # checker's field of view as its own validation
      functions:
        # A bare call to select(...) counts only when this file imported that name from
        # sqlalchemy. Without that condition, any project function called update() or
        # delete() would match.
        names: [select, insert, update, delete]
        imported_from: [sqlalchemy]
      methods:
        # A call like db.execute(...) counts only when the receiver is a database session,
        # either by name or by the annotation in the enclosing function's signature.
        names: [execute, scalar, scalars, stream, stream_scalars, add, delete, commit,
                flush, refresh, merge]
        receiver_names: [db, session, conn, connection, async_session]
        receiver_types: [AsyncSession, Session]
      finding_granularity: >-
        One finding per query, anchored at the line where the query is built. A line that only
        runs a query built on an earlier line — "result = await db.execute(stmt)" — is named
        inside that finding's description rather than reported as a finding of its own. This
        is why the two queries in src/search/router.py occupy four lines (61, 62, 68, 69) but
        are two findings, at 61 and 68. Reporting four would not be wrong about the code, but
        it would count one problem twice, and the count is the thing people will look at.
        Stated here so it is settled before the checker is written, not discovered as a
        mismatch afterwards.
    exceptions:
      - path: src/health/router.py
        # line pin removed 2026-08-30 (Rich's word): the backwards run showed the pin
        # produced all three historical false alarms as the file grew; the exception now
        # names the file and the statement, wherever it sits.
        what: 'await db.execute(text("SELECT 1"))'
        why: >-
          A liveness probe. It proves the connection is up; it reads no domain data and
          returns none. Moving it to a crud.py would create a data-access layer for a
          feature that has no data model. Recorded here so the checker's silence is a
          decision somebody made, not an accident of what the checker can see.
        ruled_on: "2026-08-30"
    expected_current_finding:
      status: known violation, left in place on purpose as the checker's acceptance test
      findings:
        - at: src/search/router.py:61
          what: "stmt = select(User)   — executed at line 62 by 'result = await db.execute(stmt)'"
        - at: src/search/router.py:68
          what: "stmt = select(User)   — executed at line 69 by 'result = await db.execute(stmt)'"
      inside: "the route handler 'async def search' at src/search/router.py:50"
      introduced_by: commit 79730c0, 2026-08-16, FEAT-F924
      fix: >-
        Move both queries out of the route handler into a data-access file, so the handler
        calls a function and holds no query of its own.
    checked_against_main_on: "2026-08-30"
    other_sites_seen: >-
      Seven queries in src/users/crud.py (lines 57, 75, 90, 166, 191, 243, 269) — correct,
      must stay silent. One at src/health/router.py:41 — the named exception above. One
      inside a docstring at src/db/dependencies.py:29 — not code.

  - id: R-ADR001-1
    previously_known_as: features-do-not-import-features
    rule: >-
      A feature module may import another feature's public read interface — its crud.py and
      its schemas.py — and nothing else of that feature.
    source_document: docs/architecture/adr-001-feature-based-module-structure.md
    source_section: "Consequences — Amendment, 2026-08-31: which files are public and which are private"
    source_sentence: "A feature's **public read interface** is its `crud.py` — the functions in it whose names do not start with an underscore — and its `schemas.py`, the shapes those functions return. Another feature may import those two files."
    also_from:
      - source_sentence: "A feature's **private files** are `models.py`, `service.py`, `router.py`, `dependencies.py`, and anything whose name starts with an underscore. Another feature may not import those."
        why: names the files on the other side of the line, and it is that half of the amendment which keeps src/search/router.py:11 a finding
      - source_section: Consequences — What it forbids
        source_sentence: "Cross-feature coupling where one module imports internals from another's private files."
        why: >-
          the original sentence, which drew the public/private line without ever saying which
          files were which. The 2026-08-31 amendment completes it rather than replacing it.
    checked_by: >-
      Parse every file under src/<feature>/ with ast. For each import, take the module path;
      report a finding when it starts with src.<other> where <other> is a different feature
      module — with one exception, and two things that exception does not cover. The
      exception: src.<other>.crud and src.<other>.schemas are that feature's public read
      interface, and importing them is the sanctioned way for one feature to read another's
      data, so they are not reported. Not covered by it: a name in such an import that starts
      with an underscore is that feature's private helper wearing a public file's address and
      is still reported; and a bare import of src.<other>, with no file named after it,
      reaches every file in the feature and is still reported. Feature to infrastructure
      (src.core, src.db) is the intended direction and is not reported. Imports within the
      same feature are not reported. src/main.py is skipped entirely — joining the features
      together is its job. What the checker cannot see: it reads which files an import names,
      not what a function returns, so the amendment's instruction that public functions
      return schemas or plain data and never ORM model instances is written guidance for
      people and is checked by nothing.
    signals:
      kind: module-import-boundary
      scope: feature_modules
      allowed_target_modules: [src.core, src.db]
      public_modules: [crud, schemas]
      skip_files: [src/main.py]
    expected_current_finding:
      status: >-
        The second symptom of the same known violation as R-OV-1, not a separate one. The
        import exists only so the route handler can run its own query, and it disappears
        when that query moves out. Left in place on purpose alongside it. The 2026-08-31
        amendment does not excuse it: models.py is a private file, and the legal move — had
        the search feature needed user data for its own sake — is src.users.crud.
      findings:
        - at: src/search/router.py:11
          what: "from src.users.models import User"
      introduced_by: commit 79730c0, 2026-08-16, FEAT-F924
    checked_against_main_on: "2026-08-31"
    other_sites_seen: >-
      This is the only feature-to-feature import in the repository. src/main.py:19-28
      imports every feature's router (composition root, skipped). src/users/__init__.py:3-5
      and src/users/router.py:15-28 import from within src/users. src/search/router.py:9,
      src/health/router.py:10-11 and src/whoami/router.py:7 import src.core or src.db. All
      must stay silent. No file in this repository imports another feature's crud.py or
      schemas.py today, so the public read interface the amendment allows changes nothing
      about what this rule reports on main; it changes what a new feature is allowed to
      write.

  - id: R-ADR001-2
    rule: There is no global models/ or schemas/ directory; each feature keeps its own.
    source_document: docs/architecture/adr-001-feature-based-module-structure.md
    source_section: Consequences — What it forbids
    source_sentence: "Creating a global `models/` directory containing all ORM models."
    also_from:
      source_sentence: "**The sanctioned exception**: the shared base-class file `src/schemas.py` (`BaseSchema` and friends, inherited by feature schemas) is allowed under the no-global-schemas rule."
      why: names the one thing at src/ level that is allowed, so the checker does not report it
    checked_by: >-
      File layout only, no parsing. Report a finding if a directory src/models/ or
      src/schemas/ exists. The file src/schemas.py is explicitly allowed — the check is for a
      directory, not a file.
    signals:
      kind: file-layout
      forbidden_directories: [src/models, src/schemas]
      allowed_files: [src/schemas.py]
    checked_against_main_on: "2026-08-30"
    other_sites_seen: Neither directory exists. src/schemas.py exists and is the sanctioned exception.

  - id: R-ADR001-3
    rule: Every feature module contains a router.py.
    source_document: docs/architecture/adr-001-feature-based-module-structure.md
    source_section: Decision — The rule
    source_sentence: "`router.py` (API endpoints) — required in every feature"
    checked_by: >-
      File layout only. For each feature module — as the layout block at the top of this file
      defines one, which means a tracked directory and never src/__pycache__ — report a
      finding if it contains no router.py.
    signals:
      kind: file-layout
      scope: feature_modules
      required_files: [router.py]
    not_checked_yet:
      what: >-
        The same list in the record also says "`schemas.py` (Pydantic models) — required in
        every feature". src/stats/ has no schemas.py today; its StatsResponse model is
        declared inside src/stats/router.py at line 92. The same gap breaks a sentence in
        ADR-003 — see the note on R-ADR003-1.
      why_not_a_rule_yet: >-
        Only one known violation is deliberately carried in this file, and it is the search
        router one. A second unfixed rule would make the checker's first report mostly
        noise. Recorded here for the next architecture sitting to decide: either src/stats
        gets a schemas.py, or "required in every feature" changes to match what the code does.
    checked_against_main_on: "2026-08-30"
    other_sites_seen: All eight features (health, search, stats, time, uptime, users, version, whoami) have a router.py.

  - id: R-ADR002-1
    rule: Route handlers are declared with async def.
    source_document: docs/architecture/adr-002-async-first-io.md
    source_section: Decision
    source_sentence: "Synchronous blocking calls are forbidden in route handlers and service layers."
    checked_by: >-
      Parse src/ with ast. A route handler is any function whose decorators include a call on
      some object naming an HTTP method — the shape matters, the name of the object does not.
      Report a finding when such a function is an ordinary def rather than an async def: a
      synchronous handler cannot await anything, and blocks the event loop for the whole
      request.
    signals:
      kind: handler-shape
      # Match the SHAPE — a decorator of the form <anything>.<http-method>(...) — not a list
      # of receiver names. A checker hard-coding "router" and "app" would miss
      # src/users/router.py:407, where get_recent_users is decorated @recent_router.get
      # because that feature mounts a second router object at line 404. It would then scan 19
      # of this repository's 20 handlers and report nothing about the twentieth. (That handler
      # passes both handler rules anyway — it is async def and returns RecentUsersResponse —
      # so nothing is hidden today; the gap would be in the checker, not in the code.)
      handler_decorator_shape: an attribute call on any object, where the attribute is an HTTP method name
      http_method_names: [get, post, put, patch, delete, head, options]
      require: AsyncFunctionDef
    checked_against_main_on: "2026-08-30"
    other_sites_seen: >-
      All twenty route handlers in the repository are async def. Nineteen are decorated
      @router.<method>; the twentieth, get_recent_users at src/users/router.py:420, is
      decorated @recent_router.get.

  - id: R-ADR002-2
    rule: Feature code does not use blocking I/O libraries.
    source_document: docs/architecture/adr-002-async-first-io.md
    source_section: Consequences
    source_sentence: "**What it forbids**: Using blocking libraries (e.g., `requests`, standard `psycopg2`) inside async routes; performing long-running CPU-bound tasks directly on the event loop without offloading."
    checked_by: >-
      Parse src/ with ast. Report a finding for any import of the named blocking libraries or
      their direct standard-library equivalents, and for any call to time.sleep(...). The
      second half of the sentence, about long-running CPU-bound work, is a judgement about
      what a piece of code costs to run and is deliberately not machine-checked.
    signals:
      kind: forbidden-imports
      scope: all
      modules: [requests, psycopg2, urllib.request, http.client, MySQLdb]
      calls: [time.sleep]
    checked_against_main_on: "2026-08-30"
    other_sites_seen: >-
      No file under src/ imports any of these or calls time.sleep. The async driver in use is
      asyncpg, via SQLAlchemy's async engine in src/db/session.py.

  - id: R-ADR003-1
    rule: A route handler declares the type it returns, and never returns a bare dictionary.
    source_document: docs/architecture/adr-003-pydantic-v2-validation.md
    source_section: Decision
    source_sentence: "No raw dictionaries or untyped objects should be returned from routers."
    checked_by: >-
      Parse src/ with ast. For each route handler (same decorator test as R-ADR002-1), report
      a finding if it has no return annotation, or if the annotation is dict, Dict, Any or
      object. What the annotation is beyond that is not checked — the two delete handlers at
      src/users/router.py:499 and :551 return a Starlette Response for a 204 reply, which is
      a typed object and correct.
    signals:
      kind: handler-shape
      handler_decorator_shape: same as R-ADR002-1 — match the shape, not a list of names
      require: return annotation present
      forbidden_annotations: [dict, Dict, Any, object]
    not_checked_yet:
      what: >-
        The same ADR also says "Models must be defined in the `schemas.py` file within each
        feature module." src/stats/router.py:92 declares the Pydantic model StatsResponse
        inside router.py, so today's code does not satisfy that sentence. The 2026-08-22
        draft carried this as a live rule (response-schemas-live-in-schemas-py) without
        noticing that the repository fails it.
      why_not_a_rule_yet: Same reason as the note on R-ADR001-3 — it is the same src/stats gap, and only one known violation is deliberately carried in this file.
    checked_against_main_on: "2026-08-30"
    other_sites_seen: All twenty route handlers carry an explicit return annotation; none is dict or Any.

  - id: R-ADR004-1
    rule: Database access uses SQLAlchemy 2.0 select and execute, not the legacy Query API.
    source_document: docs/architecture/adr-004-sqlalchemy-async-orm.md
    source_section: Decision
    source_sentence: "Leveraging SQLAlchemy 2.0's `select()` and `execute()` patterns rather than legacy query objects."
    checked_by: >-
      Parse src/ with ast. Report a finding for any call to a method named query on a
      database session — db.query(...), session.query(...), or a call on a parameter
      annotated AsyncSession or Session. That is the SQLAlchemy 1.x style the record retires.
    signals:
      kind: forbidden-method-call
      scope: all
      methods: [query]
      receiver_names: [db, session, conn, connection, async_session]
      receiver_types: [AsyncSession, Session]
    checked_against_main_on: "2026-08-30"
    other_sites_seen: No .query( call exists anywhere in src/.

  - id: R-ADR004-2
    previously_known_as: orm-models-live-in-models-py
    rule: ORM model classes live in the feature's models.py and inherit the shared DeclarativeBase.
    source_document: docs/architecture/adr-004-sqlalchemy-async-orm.md
    source_section: Decision
    source_sentence: "Defining models using the `DeclarativeBase` pattern."
    also_from:
      source_document: docs/architecture/00-system-overview.md
      source_sentence: "**Model Layer (`models.py`)**: Contains SQLAlchemy ORM models, database table definitions, and relationship constraints."
      why: names models.py as where an ORM model belongs, which is the other half of this rule
    checked_by: >-
      Parse src/<feature>/ with ast. A class is a database table class when its body assigns
      __tablename__ or calls mapped_column(...). Report a finding if such a class is declared
      in a file other than models.py, or if DeclarativeBase is not among its base classes.
      src/db/base.py is skipped — it declares the base itself, which is infrastructure.
    signals:
      kind: class-definition-home-file
      home_file: models.py
      scope: feature_modules
      class_marks: [__tablename__, mapped_column]
      required_base_names: [DeclarativeBase]
    checked_against_main_on: "2026-08-30"
    other_sites_seen: >-
      One ORM model exists — class User at src/users/models.py:18 — and it inherits
      DeclarativeBase imported from src.db.base at line 12.

  - id: R-ADR005-1
    rule: Strict mypy and ruff stay configured in pyproject.toml.
    source_document: docs/architecture/adr-005-strict-type-enforcement.md
    source_section: Decision
    source_sentence: "This is enforced via `[tool.mypy] strict = true` in `pyproject.toml` (verified present); there is no CI pipeline in this repository today."
    also_from:
      source_document: docs/architecture/00-system-overview.md
      source_sentence: "**Quality Gates**: Ruff linting and strict MyPy type checking, both configured in `pyproject.toml` and run locally. There is no pre-commit configuration and no CI workflow in this repository."
      why: names ruff alongside mypy as the pair that must stay configured
    checked_by: >-
      Read pyproject.toml as TOML. Report a finding if the [tool.mypy] table is missing or
      does not set strict = true, or if there is no [tool.ruff] table. Only the presence of
      the configuration is checked; neither tool is run by the checker. The record's
      observation that there is no CI pipeline and no pre-commit config is a statement of
      fact about today, not a rule — adding CI later would be an improvement, so nothing here
      reports it.
    signals:
      kind: config-file-fact
      file: pyproject.toml
      require:
        - "table [tool.mypy] exists"
        - "tool.mypy.strict is true"
        - "table [tool.ruff] exists"
    checked_against_main_on: "2026-08-30"
    other_sites_seen: 'pyproject.toml line 23 [tool.ruff]; line 34 [tool.mypy] with strict = true at line 36.'

  - id: R-ADR005-2
    rule: Every function in src/ has type annotations on its arguments and its return.
    source_document: docs/architecture/adr-005-strict-type-enforcement.md
    source_section: Consequences
    source_sentence: "**Forbids**: Implicit `Any` types, untyped function arguments, and unannotated return values."
    checked_by: >-
      Parse every file under src/ with ast. For each function, report a finding if the return
      annotation is missing, or if any argument other than self or cls has no annotation. An
      explicit Any is not reported — "implicit Any" in the sentence means the absence of an
      annotation, which is what this checks.
    signals:
      kind: annotation-completeness
      scope: all
      require: [return annotation, annotation on every argument]
      ignore_args: [self, cls]
    checked_against_main_on: "2026-08-30"
    other_sites_seen: Every function in src/ was scanned — zero missing annotations today.

  - id: R-ADR006-1
    rule: Database sessions arrive through dependency injection; feature code never builds its own session or engine.
    source_document: docs/architecture/adr-006-dependency-injection-for-db-sessions.md
    source_section: Consequences
    source_sentence: "**What it forbids**: Direct instantiation of `Session` objects within business logic or router handlers."
    checked_by: >-
      Parse src/ with ast, skipping src/db/ where the session machinery legitimately lives.
      Report a finding for any call that constructs a session or an engine outside src/db/. A
      handler that needs a session takes it as a parameter — db: AsyncSession = Depends(get_db),
      or the AsyncSessionDep alias from src/db/dependencies.py.
    signals:
      kind: forbidden-construction
      scope: all
      skip_directories: [src/db]
      calls: [Session, AsyncSession, sessionmaker, async_sessionmaker, create_async_engine]
    checked_against_main_on: "2026-08-30"
    other_sites_seen: >-
      Every session and engine construction sits in src/db/session.py (async_sessionmaker at
      line 116, the engine at lines 32 and 54). src/search/router.py:52,
      src/health/router.py:31 and the users handlers all take the session via Depends(get_db).

# ---------------------------------------------------------------------------
# Considered and deliberately LEFT OUT — recorded so a later session does not add them
# back without reading why. The first two are carried forward from the 2026-08-22 draft.
# ---------------------------------------------------------------------------
not_rules:

  - id: routers-do-not-hold-business-logic
    would_say: "Business logic lives in a service or data-access file, not in router.py."
    source_would_be:
      source_document: docs/architecture/00-system-overview.md
      source_sentence: "**Service Layer (`service.py`)**: Orchestrates business logic, complex operations, and cross-entity coordination."
    left_out_because: >-
      No mechanical definition of "business logic" survives contact with this repository.
      Every candidate test — a statement count, a loop over query results, a comprehension —
      also matches src/users/router.py, which is the repository's own example of a router
      done right. This needs judgement, which is exactly what a deterministic checker does not
      have. It is the first thing to hand to a model later, and it is not a rule today. The
      ruling of 2026-08-30 also made service.py allowed rather than required, and an
      allowed-not-required item produces no rule.

  - id: tests-mirror-src
    would_say: "Every feature module under src/ has a matching directory under tests/."
    source_would_be:
      source_document: docs/architecture/00-system-overview.md
      source_sentence: "**Automated Testing**: Pytest with async support (`pytest-asyncio`) and coverage reporting (`pytest-cov`), targeting 80% line coverage."
    left_out_because: >-
