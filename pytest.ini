[pytest]
# Pytest configuration for TASK-003D tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Asyncio configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Coverage options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=installer/core/lib
    --cov-report=term-missing
    --cov-report=json
    --cov-branch

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    e2e: End-to-end tests
    seam: Seam (technology boundary) integration tests
    integration_contract(name): Seam-test contract identifier (e.g. SPECIALIST_RESULTS_JSON)
    workflow: Workflow integration tests
    benchmark: Performance benchmark tests
    asyncio: Async test functions
    live: Live tests requiring real infrastructure (Neo4j, OPENAI_API_KEY)
    real_world: Real-world scenario tests
    qav_behavioural_gates: QA Verifier behavioural-evidence gates feature
    task: Task-tagged BDD scenarios (e.g. task:TASK-QAV-001)
    key_example: Key example scenarios (pytest-bdd converts key-example)
    key-example: Key example scenarios
    smoke: Smoke test scenarios
    regression: Regression test scenarios
    boundary: Boundary condition scenarios
    negative: Negative test scenarios
    edge_case: Edge case scenarios (pytest-bdd converts edge-case)
    edge-case: Edge case scenarios

# Minimum coverage thresholds
[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:run]
branch = True
source = installer/core/lib
omit =
    */tests/*
    */__pycache__/*
    */site-packages/*
