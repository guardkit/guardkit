
# Which memory this repository's own builds read and write (2026-09-21).
# GuardKit gets its memory the same way every other project does: by saying so
# here. There is no built-in default any more — a project that says nothing runs
# with memory off rather than filing its work under somebody else's name.
memory:
  project: guardkit

# QAV shadow mode (2026-07-25, design: ai-transition docs/qav-shadow-mode-design-2026-07-25.md).
# Log-only second opinion beside every coach verdict — never blocks, absent-not-fail,
# default OFF when this block is missing. Reversible one-line kill: enabled: false or
# delete the block. Zero verdict impact by construction (never-raise wrappers; the
# receipt qav_shadow_turn_N.json lands beside coach_turn_N.json).
autobuild:
  coach:
    # Coach v4 flip (2026-07-26, Rich's do-it-now): the tuned coach-ft-v4 seat
    # + the raw v4 wire contract. env GUARDKIT_COACH_CONTRACT / --coach-model
    # still override. Rollback = delete these two lines (defaults restore
    # gemma4-coach pairing at launch + the legacy coachsplit contract).
    contract: v4
    model: coach-ft-v4
    qav_shadow:
      enabled: true
      endpoint: http://localhost:9000/v1/chat/completions
      model: qav-shadow
      timeout_seconds: 60
